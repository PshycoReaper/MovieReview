@if (showModal() && current) {
<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6">

    <!-- Título -->
    <div class="mb-6">
      <h2 class="text-2xl font-bold text-gray-800">
        {{ typeLabel }}
      </h2>
      <p class="text-gray-500 text-sm">
        Revisa la solicitud y actualiza su estado.
      </p>
    </div>

    <!-- Detalle (solo lectura) -->
    <div class="space-y-3 mb-6 bg-slate-50 rounded-lg p-4 border border-slate-200">
      <div>
        <span class="block text-xs uppercase text-slate-400 font-semibold">Nombre</span>
        <span class="text-slate-800">{{ current.fullName }}</span>
      </div>
      <div>
        <span class="block text-xs uppercase text-slate-400 font-semibold">Correo</span>
        <span class="text-slate-800">{{ current.email }}</span>
      </div>
      @if (current.movieTitle) {
        <div>
          <span class="block text-xs uppercase text-slate-400 font-semibold">Película</span>
          <span class="text-slate-800">{{ current.movieTitle }}</span>
        </div>
      }
      <div>
        <span class="block text-xs uppercase text-slate-400 font-semibold">Mensaje</span>
        <span class="text-slate-800 whitespace-pre-line">{{ current.message }}</span>
      </div>
    </div>

    <!-- Formulario de gestión -->
    <form #manageForm="ngForm" (ngSubmit)="saveChanges()" class="space-y-5">

      <!-- Estado -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Estado
        </label>
        <select
          name="status"
          [(ngModel)]="status"
          required
          class="w-full rounded-lg border border-gray-300 px-4 py-2 focus:ring-2 focus:ring-cyan-500 focus:outline-none">
          <option value="pending">Pendiente</option>
          <option value="in_progress">En proceso</option>
          <option value="resolved">Resuelta</option>
        </select>
      </div>

      <!-- Notas del admin -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Notas internas
        </label>
        <textarea
          rows="4"
          name="adminNotes"
          [(ngModel)]="adminNotes"
          placeholder="Notas para el equipo (opcional)..."
          class="w-full rounded-lg border border-gray-300 px-4 py-2 resize-none focus:ring-2 focus:ring-cyan-500 focus:outline-none">
        </textarea>
      </div>

      <!-- Botones -->
      <div class="flex justify-end gap-3">
        <button
          type="button"
          (click)="closeModal()"
          [disabled]="isLoading()"
          class="px-5 py-2 rounded-lg border border-gray-300 hover:bg-gray-100 transition">
          Cancelar
        </button>
        <button
          type="submit"
          [disabled]="manageForm.invalid || isLoading()"
          class="bg-cyan-500 hover:bg-cyan-600 disabled:bg-gray-400 disabled:cursor-not-allowed text-white px-5 py-2 rounded-lg transition">
          @if (isLoading()) {
            <span>Guardando...</span>
          } @else {
            <span>Guardar cambios</span>
          }
        </button>
      </div>
    </form>
  </div>
</div>
}
