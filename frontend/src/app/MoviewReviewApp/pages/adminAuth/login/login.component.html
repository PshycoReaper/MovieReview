<div class="min-h-screen flex bg-brand-cream">

  <!-- ================= Panel de marca (izquierda, solo desktop) ================= -->
  <div class="hidden lg:flex lg:w-1/2 bg-brand-dark relative overflow-hidden items-center justify-center">

    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(circle_at_20%_20%,white,transparent_35%)]"></div>

    <div class="relative z-10 text-center px-10">
      <h1 class="text-5xl font-display mb-4">
        <span class="text-brand-cream">Film</span><span class="text-brand-gold">Talk</span>
      </h1>
      <p class="text-slate-300 max-w-sm mx-auto">
        Panel de administración. Gestiona películas, reseñas y peticiones de la comunidad.
      </p>
    </div>
  </div>

  <!-- ================= Formulario ================= -->
  <div class="flex flex-1 items-center justify-center px-6 py-12">

    <div class="w-full max-w-sm">

      <div class="mb-8 text-center lg:text-left">
        <h2 class="text-2xl font-display text-brand-dark lg:hidden mb-1">
          <span>Film</span><span class="text-brand-gold">Talk</span>
        </h2>
        <h2 class="text-2xl font-semibold text-brand-dark">
          Iniciar sesión
        </h2>
        <p class="text-slate-500 mt-1 text-sm">
          Ingresa tus credenciales de administrador.
        </p>
      </div>

      <form (ngSubmit)="iniciarSesion()" class="space-y-5">

        <div>
          <label for="email" class="block mb-1.5 text-sm font-medium text-brand-dark">
            Correo electrónico
          </label>
          <div class="relative">
            <i class="bi bi-envelope-fill absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              placeholder="admin@filmtalk.com"
              [(ngModel)]="email"
              class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-brand-gold transition">
          </div>
        </div>

        <div>
          <label for="password" class="block mb-1.5 text-sm font-medium text-brand-dark">
            Contraseña
          </label>
          <div class="relative">
            <i class="bi bi-lock-fill absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              [(ngModel)]="password"
              class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-brand-gold transition">
          </div>
        </div>

        <button
          type="submit"
          class="w-full flex items-center justify-center gap-2 py-3 rounded-xl bg-brand-dark text-white font-semibold hover:bg-brand-dark/90 transition">
          <i class="bi bi-box-arrow-in-right"></i>
          Iniciar sesión
        </button>

      </form>

    </div>

  </div>

</div>
