<div class="flex justify-center items-center h-screen bg-[#f5f5f5]">

    <div class="w-87.5 p-7.5 bg-white rounded-[10px] shadow-[0_0_10px_rgba(0,0,0,.15)]">

        <h2 class="text-center mb-2.5">MovieReview</h2>
        <p class="text-center text-gray-500 mb-5">Panel de Administración</p>

        <form>

            <label for="email" class="block mb-1">Correo electrónico</label>

            <input
                id="email"
                name="email"
                type="email"
                placeholder="Correo"
                [(ngModel)]="email"
                class="w-full p-2.5 box-border border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">

            <br><br>

            <label for="password" class="block mb-1">Contraseña</label>

            <input
                id="password"
                name="password"
                type="password"
                placeholder="Contraseña"
                [(ngModel)]="password"
                class="w-full p-2.5 box-border border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">

            <br><br>

            <button
                type="button"
                (click)="iniciarSesion()"
                class="w-full p-2.5 cursor-pointer bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition-colors duration-200">
                Iniciar sesión
            </button>

        </form>

    </div>

</div>
