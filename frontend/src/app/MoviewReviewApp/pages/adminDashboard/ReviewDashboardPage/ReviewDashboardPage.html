<div class="flex flex-direction flex-col gap-6">
  <!-- Banner de filtro por película -->
  @if (filteredMovieId()) {
    <div class="bg-indigo-50 border border-indigo-200 text-indigo-800 px-4 py-3 rounded flex items-center justify-between">
      <span>
        Mostrando reseñas de:
        <strong>{{ filteredMovie()?.title || 'película seleccionada' }}</strong>
      </span>
      <button (click)="clearMovieFilter()" class="text-indigo-700 underline hover:text-indigo-900 text-sm">
        Ver todas las reseñas
      </button>
    </div>
  }

  <!-- Indicador de carga global -->
  @if (isLoading()) {
    <div class="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded">
      <span>Cargando...</span>
    </div>
  }

  <!-- Mensaje de error -->
  @if (errorMessage()) {
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded flex justify-between">
      <span>{{ errorMessage() }}</span>
      <button (click)="errorMessage.set(null)" class="text-red-700 hover:text-red-900">
        ✕
      </button>
    </div>
  }

  <form-review
    [modaltitle]="modalTittle()"
    [buttonText]="buttonText()"
    (submitReview)="updateReview($event)"
  />

  <table-component
    [title]="title()"
    [columns]="reviewColumns"
    [data]="reviews()"
    [addRequired]="false"
    [trackBy]="trackBy()"
    (edit)="editReview($event)"
    (delete)="deleteReview($event)"
  />
</div>
