<div class="flex-1 p-8 overflow-auto">

  <!-- Título -->

  <div class="mb-8">

    <h1 class="text-4xl font-bold text-slate-800">

      Dashboard

    </h1>

    <p class="text-slate-500 mt-2">

      Bienvenido nuevamente, administrador 👋

    </p>

  </div>

  <!-- ================= Cards ================= -->

  <div class="grid lg:grid-cols-2 gap-6">

    <div class="bg-white rounded-2xl shadow-md p-6">

      <div class="flex justify-between">

        <div>

          <p class="text-slate-500">

            Películas

          </p>

          <h2 class="text-4xl font-bold mt-2">

            {{ moviesDBArray().length }}


          </h2>

        </div>

        <i class="fa-solid fa-film text-3xl text-red-500"></i>

      </div>

    </div>

    <div class="bg-white rounded-2xl shadow-md p-6">

      <div class="flex justify-between">

        <div>

          <p class="text-slate-500">

            Reseñas

          </p>

          <h2 class="text-4xl font-bold mt-2">

            {{ reviewsArray().length }}

          </h2>

        </div>

        <i class="fa-solid fa-star text-3xl text-yellow-500"></i>

      </div>

    </div>

  </div>

  <!-- ================= Catalogo Popular ================= -->

  <div class="bg-white rounded-2xl shadow-md mt-8 p-6">

    <div class="flex justify-between items-center mb-5">

      <h2 class="text-2xl font-semibold">

        Películas Populares

      </h2>

    </div>
    <div class="grid gap-5 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-10">

      @for (movie of moviesApiArray(); track movie.id) {

      <div class="rounded-xl bg-slate-50 p-3 shadow hover:shadow-lg transition">

        <img [src]="imageUrl + movie.poster" class="rounded-lg w-50 aspect-2/3 object-cover">

        <h3 class="font-semibold mt-3 line-clamp-2">

          {{ movie.title }}

        </h3>

      </div>

      }

    </div>

  </div>

  <!-- ================= Tabla ================= -->
  <table-component [title]="title()" [buttonText]="buttonText()" [columns]="movieColumns" [data]="moviesApiArray()" />

</div>
