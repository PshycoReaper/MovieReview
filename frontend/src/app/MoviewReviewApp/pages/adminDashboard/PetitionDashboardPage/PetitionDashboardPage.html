<div class="flex flex-direction flex-col gap-6">

  <!-- Indicador de carga global -->
  @if (isLoading()) {
    <div class="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded">
      <span>Cargando...</span>
    </div>
  }

  <!-- Mensaje de error -->
  @if (errorMessage()) {
    <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded flex justify-between">
      <span>{{ errorMessage() }}</span>
      <button (click)="errorMessage.set(null)" class="text-red-700 hover:text-red-900">
        ✕
      </button>
    </div>
  }

  <form-contact-request
    (submitUpdate)="updateRequest($event)"
  />

  <table-component
    [title]="title()"
    [columns]="requestColumns"
    [data]="requests()"
    [addRequired]="false"
    [trackBy]="trackBy()"
    (edit)="viewRequest($event)"
    (delete)="deleteRequest($event)"
  />
</div>
